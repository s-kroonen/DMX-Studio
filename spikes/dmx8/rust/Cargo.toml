[package]
name = "dmx8-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike DMX-8: audio loopback latency with cpal. Throwaway code, never merged."

[dependencies]
cpal = "=0.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }

[features]
pipewire = ["cpal/pipewire"]

[profile.release]
debug = false

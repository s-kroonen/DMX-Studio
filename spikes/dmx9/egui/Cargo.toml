[package]
name = "dmx9-egui"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike DMX-9: 3D room view with picking in egui. Throwaway code, never merged."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
log = "0.4"
web-time = "1.1"

# For `--frame system`: run through XWayland so GNOME draws its own window frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[profile.release]
opt-level = 3
